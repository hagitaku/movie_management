name: front-nextjs-ci
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - develop
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Check npm version
        run: npm --version
      - name: Debug package-lock.json
        run: ls -l frontend/projects/package-lock.json
      #- name: Cache Node.js modules
      #uses: actions/cache@v3
      #with:
      #path: ~/.npm
      #key: ${{ runner.os }}-node-${{ hashFiles('frontend/projects/package-lock.json') }}
      #restore-keys: |
      #${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
        working-directory: frontend/projects
      - name: Format code
        run: npm run format
      - name: Lint code
        run: npm run lint
